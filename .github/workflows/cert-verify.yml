name: Verify Windows Code Signing Certificate

on:
  workflow_call:
  workflow_dispatch:    

jobs:
  verify-cert:
    name: Create and verify PFX
    runs-on: windows-2022
    steps:
      - name: Check out repository (optional)
        uses: actions/checkout@v4

      - name: Create PFX from base64 and verify password
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $b64 = "${{ secrets.WINDOWS_PFX_BASE64 }}"
          Write-Host "Criando certificado PFX..."
          $filename = 'certificado.pfx'

          if ([string]::IsNullOrWhiteSpace($b64)) {
            Write-Error "WINDOWS_PFX_BASE64 está vazio ou não definido! Configure o secret no repositório/organização."
            exit 1
          }

          try {
            $bytes = [Convert]::FromBase64String($b64)
          } catch {
            Write-Error "WINDOWS_PFX_BASE64 parece inválido (Base64 inválido): $($_.Exception.Message)"
            exit 1
          }

          try {
            [IO.File]::WriteAllBytes($filename, $bytes)
            Write-Host "Certificado criado com sucesso: $filename"
          } catch {
            Write-Error "Erro ao criar arquivo PFX: $($_.Exception.Message)"
            exit 1
          }

          if (-not (Test-Path $filename)) {
            Write-Error "Arquivo de certificado não foi criado!"
            exit 1
          }

          $fileSize = (Get-Item $filename).Length
          Write-Host "Tamanho do arquivo de certificado: $fileSize bytes"

          $password = "${{ secrets.WINDOWS_PFX_PASSWORD }}"
          if ([string]::IsNullOrWhiteSpace($password)) {
            Write-Error "WINDOWS_PFX_PASSWORD está vazio ou não definido! Configure o secret no repositório/organização."
            exit 1
          }

          Write-Host "Testando certificado com a senha fornecida..."
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2
          $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          try {
            $cert.Import($filename, $password, $flags)
          } catch {
            Write-Error "❌ Erro ao importar PFX com a senha fornecida (senha incorreta ou PFX inválido): $($_.Exception.Message)"
            exit 1
          }

          # Verificar validade temporal
          $now = Get-Date
          if ($now -lt $cert.NotBefore -or $now -gt $cert.NotAfter) {
            Write-Error "❌ Certificado expirado ou ainda não válido! NotBefore=$($cert.NotBefore) NotAfter=$($cert.NotAfter)"
            exit 1
          }

          # Gerar arquivo de informações do certificado (sem expor a senha)
          $lines = @(
            'Informações do Certificado PFX',
            '================================',
            "Data de teste: $(Get-Date -Format s)",
            "Subject: $($cert.Subject)",
            "Issuer: $($cert.Issuer)",
            "Thumbprint: $($cert.Thumbprint)",
            "Valid From: $($cert.NotBefore)",
            "Valid To: $($cert.NotAfter)",
            "Tamanho do arquivo: $fileSize bytes",
            'Status: Válido e testado com sucesso'
          )
          $lines | Out-File -FilePath 'certificate-info.txt' -Encoding UTF8

          Write-Host "✅ Certificado validado com sucesso. Artefatos serão enviados."

      - name: Upload certificate and info
        uses: actions/upload-artifact@v4
        with:
          name: certificate-verification
          path: |
            certificado.pfx
            certificate-info.txt
          if-no-files-found: error
          retention-days: 7
