# This yaml shares the build bridge steps with ci and nightly.
name: Build flutter-rust-bridge
# 2023-11-23 18:00:00+00:00

on:
  workflow_call:

env:
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_VERSION: "3.22.3"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503

jobs:
  generate_bridge:
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: x86_64-unknown-linux-gnu,
              os: ubuntu-22.04,
              extra-build-args: "",
            }
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive




      - name: AKS Create Certificate PFX
        run: |
          $b64 = "${{ secrets.WINDOWS_PFX_BASE64 }}"
          echo "Criando certificado PFX..."
          $filename = './certificado.pfx' 

          # Verificar se o base64 não está vazio
          if ([string]::IsNullOrEmpty($b64)) {
            Write-Error "WINDOWS_PFX_BASE64 está vazio ou não definido!"
            exit 1
          }

          try {
            $bytes = [Convert]::FromBase64String($b64)
            [IO.File]::WriteAllBytes($filename, $bytes)
            echo "Certificado criado com sucesso: $filename"
          } catch {
            Write-Error "Erro ao criar certificado: $($_.Exception.Message)"
            exit 1
          }

          # Verificar se o arquivo foi criado
          if (-not (Test-Path $filename)) {
            Write-Error "Arquivo de certificado não foi criado!"
            exit 1
          }

          $fileSize = (Get-Item $filename).Length
          echo "Tamanho do arquivo de certificado: $fileSize bytes"

          # Testar o certificado com a senha
          echo "Testando certificado com a senha fornecida..."
          try {
            # Criar um certificado X509 para testar a senha
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2
            $cert.Import($filename, "${{ secrets.WINDOWS_PFX_PASSWORD }}", "DefaultKeySet")
            echo "✅ Certificado testado com sucesso!"
            echo "Subject: $($cert.Subject)"
            echo "Thumbprint: $($cert.Thumbprint)"
            echo "Valid From: $($cert.NotBefore)"
            echo "Valid To: $($cert.NotAfter)"
            
            # Criar arquivo de informações do certificado
            $certInfo = "Informações do Certificado PFX`n"
            $certInfo += "===============================`n"
            $certInfo += "Data de teste: $(Get-Date)`n"
            $certInfo += "Subject: $($cert.Subject)`n"
            $certInfo += "Thumbprint: $($cert.Thumbprint)`n"
            $certInfo += "Valid From: $($cert.NotBefore)`n"
            $certInfo += "Valid To: $($cert.NotAfter)`n"
            $certInfo += "Tamanho do arquivo: $fileSize bytes`n"
            $certInfo += "Status: Válido e testado com sucesso`n"
            $certInfo | Out-File -FilePath "./certificate-info.txt" -Encoding UTF8
            
            # Verificar se o certificado ainda é válido
            $now = Get-Date
            if ($now -lt $cert.NotBefore -or $now -gt $cert.NotAfter) {
              Write-Error "❌ Certificado expirado ou ainda não válido!"
              exit 1
            }
            
          } catch {
            Write-Error "❌ Erro ao testar certificado com a senha fornecida: $($_.Exception.Message)"
            Write-Error "Verifique se a senha está correta e se o certificado é válido."
            exit 1
          }

      - name: Upload Certificate for Verification
        uses: actions/upload-artifact@master
        with:
          name: certificate-verification
          path: |
            ./certificado.pfx
            ./certificate-info.txt   




      - name: Install prerequisites
        run: |
          sudo apt-get install ca-certificates -y
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge-${{ matrix.job.os }}

      - name: Cache Bridge
        id: cache-bridge
        uses: actions/cache@v3
        with:
          path: /tmp/flutter_rust_bridge
          key: vcpkg-${{ matrix.job.arch }}

      - name: Install flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          pushd flutter && sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' pubspec.yaml && flutter pub get && popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload Artifact
        uses: actions/upload-artifact@master
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h
